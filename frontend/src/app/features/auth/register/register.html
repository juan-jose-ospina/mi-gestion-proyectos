<div class="auth-container">
  <div class="auth-card">
    <h2>Crear Cuenta</h2>

    <div class="error-msg" *ngIf="error">{{ error }}</div>
    <div class="success-msg" *ngIf="success">{{ success }}</div>

    <div class="form-group">
      <label>Nombre</label>
      <input type="text" [(ngModel)]="name" placeholder="Tu nombre completo" />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" placeholder="correo@ejemplo.com" />
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" [(ngModel)]="password" placeholder="••••••••" />
    </div>

    <div class="form-group">
      <label>Confirmar Contraseña</label>
      <input type="password" [(ngModel)]="confirmPassword" placeholder="••••••••" />
    </div>

    <button (click)="register()" [disabled]="loading">
      {{ loading ? 'Registrando...' : 'Registrarse' }}
    </button>

    <p class="auth-link">¿Ya tienes cuenta? <a routerLink="/auth/login">Inicia sesión</a></p>
  </div>
</div>
