<div class="user-form">
  <div class="header">
    <h1>{{ isEditing ? 'Editar Usuario' : 'Nuevo Usuario' }}</h1>
    <a routerLink="/users" class="btn-back">← Volver</a>
  </div>

  <div class="form-card">
    <div class="error-msg" *ngIf="error">{{ error }}</div>
    <div class="success-msg" *ngIf="success">{{ success }}</div>

    <div class="form-group">
      <label>Nombre</label>
      <input type="text" [(ngModel)]="user.name" placeholder="Nombre completo" />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="user.email" placeholder="correo@ejemplo.com" />
    </div>

    <div class="form-group" *ngIf="!isEditing">
      <label>Contraseña</label>
      <input type="password" [(ngModel)]="user.password" placeholder="••••••••" />
    </div>

    <div class="form-group">
      <label>Rol</label>
      <select [(ngModel)]="user.role_id">
        <option [value]="2">Usuario</option>
        <option [value]="1">Superadmin</option>
      </select>
    </div>

    <div class="form-group">
      <label>Estado</label>
      <select [(ngModel)]="user.is_active">
        <option [value]="1">Activo</option>
        <option [value]="0">Inactivo</option>
      </select>
    </div>

    <button (click)="save()" [disabled]="loading">
      {{ loading ? 'Guardando...' : (isEditing ? 'Actualizar' : 'Crear Usuario') }}
    </button>
  </div>
</div>
